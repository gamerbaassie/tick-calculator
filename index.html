<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft Tick Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1e1e1e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 18px;
      margin-bottom: 10px;
      text-align: center;
    }
    label {
      display: block;
      margin-top: 10px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 6px;
      border: none;
      outline: none;
    }
    button {
      width: 100%;
      margin-top: 15px;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #4caf50;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    .result {
      margin-top: 15px;
      text-align: center;
      font-size: 16px;
    }
    .footer {
      margin-top: 15px;
      font-size: 12px;
      text-align: center;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Minecraft Tick Generator</h1>

    <label>Dagen</label>
    <input type="number" id="days" value="0" />

    <label>Uren</label>
    <input type="number" id="hours" value="0" />

    <label>Minuten</label>
    <input type="number" id="minutes" value="0" />

    <label>Seconden</label>
    <input type="number" id="seconds" value="0" />

    <button onclick="calculateTicks()">Bereken ticks</button>

    <div class="result" id="result"></div>

    <div class="footer">
      Gemaakt door GamerBaas321
    </div>
  </div>

  <script>
    function calculateTicks() {
      let days = parseInt(document.getElementById('days').value) || 0;
      let hours = parseInt(document.getElementById('hours').value) || 0;
      let minutes = parseInt(document.getElementById('minutes').value) || 0;
      let seconds = parseInt(document.getElementById('seconds').value) || 0;

      let totalSeconds = (days * 86400) + (hours * 3600) + (minutes * 60) + seconds;
      let ticks = totalSeconds * 20;

      document.getElementById('result').innerText = "Totaal ticks: " + ticks;
    }
  </script>
</body>
</html>
